name: CI

# Lancé à chaque push et à chaque pull request
on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: "Lancer les tests (sans LLM : Ollama est simulé)"
        run: pytest -v

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: tests # seulement si les tests passent
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t ai-incident-analyzer:ci .

      - name: Vérifier que l'API démarre et répond
        run: |
          docker run -d --name demo-app -p 8000:8000 ai-incident-analyzer:ci
          for i in $(seq 1 15); do curl -fs http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs demo-app
          exit 1
